#:schema node_modules/wrangler/config-schema.json
name = "pashyanti3-worker"
main = "worker/index.js"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

# Environment Variables
[vars]
# Set your Google OAuth Client ID here or in Cloudflare Dashboard:
# GOOGLE_CLIENT_ID = "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
JWT_SECRET = "pashyanti-sacred-vault-secret-key-3.0"

# Cloudflare D1 Database Binding
# In production, replace database_id with the ID generated by:
# npx wrangler d1 create pashyanti-db
[[d1_databases]]
binding = "DB"
database_name = "pashyanti-db"
database_id = "pashyanti-db"
migrations_dir = "worker"
