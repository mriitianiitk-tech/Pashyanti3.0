<!DOCTYPE html>
<html lang="en" class="dark">

    <!-- PWA Primary Meta Tags -->
    <meta name="theme-color" content="#d97706" />
    <meta name="description" content="Sacred Space for Mindful Chanting, Stotras, Sahasranamas and Cloud-Synced Naam Japa with Cloudflare D1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Google Identity Services (GIS) for Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

  <body class="min-h-screen antialiased selection:bg-amber-500/30 selection:text-amber-200 bg-slate-950 text-slate-100 light:bg-[#fbf9f4] light:text-slate-900 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register Service Worker for PWA Android / Offline Support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => console.log('Pashyanti PWA registered successfully: ', reg.scope),
            (err) => console.log('ServiceWorker registration error: ', err)
          );
        });
      }
    </script>
  </body>
