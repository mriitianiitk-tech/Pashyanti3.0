<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <radialGradient id="auraGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#b45309" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  
  <!-- Outer Sacred Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.5" />
  
  <!-- Aura glow -->
  <circle cx="256" cy="256" r="180" fill="url(#auraGrad)" />
  
  <!-- Om Sacred Symbol in Sanskrit font styling -->
  <text x="256" y="325" 
        font-family="'Martel', 'Cinzel', 'Noto Serif Devanagari', 'Mukta', serif" 
        font-size="240" 
        font-weight="bold" 
        text-anchor="middle" 
        fill="url(#goldGrad)" 
        filter="url(#glow)">ॐ</text>

  <!-- Pashyanti subtext -->
  <text x="256" y="440" 
        font-family="'Cinzel', 'Montserrat', sans-serif" 
        font-size="32" 
        font-weight="600" 
        letter-spacing="8" 
        text-anchor="middle" 
        fill="#fcd34d" 
        opacity="0.9">PASHYANTI</text>
</svg>
